<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#10b981" />
  <title>Food Health Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Barcode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🥗 Food Health Tracker</h1>
      <p id="syncStatus" class="subtitle">Not connected to Google Sheets</p>
    </div>
    <div class="auth-actions">
      <button id="authBtn" class="btn btn-primary">Sign in with Google</button>
      <button id="settingsToggleBtn" class="btn btn-ghost" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- Settings Drawer -->
  <section id="settingsPanel" class="card hidden">
    <h2>Connection Settings</h2>
    <p class="hint">Stored locally in your browser only — never committed to GitHub.</p>
    <label>
      Google OAuth Client ID
      <input type="text" id="clientIdInput" placeholder="123456789-xxxx.apps.googleusercontent.com" />
    </label>
    <label>
      Google Spreadsheet ID
      <input type="text" id="sheetIdInput" value="1X6ZyKBCrsx6eM8zWT15s_CDtFV4zZMlzCXpUoSsB54c" />
    </label>
    <label>
      Main Sheet Tab Name
      <input type="text" id="sheetNameInput" value="Overall" />
    </label>
    <div class="row-actions">
      <button id="saveSettingsBtn" class="btn btn-primary">Save & Sync</button>
    </div>
  </section>

  <!-- Navigation Tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="catalog">Foods (<span id="foodCount">0</span>)</button>
    <button class="tab" data-tab="add">+ Add Food</button>
  </nav>

  <!-- Dashboard View -->
  <main id="tab-dashboard" class="tab-content active">
    <div class="kpi-grid">
      <div class="card kpi">
        <span class="kpi-label">Overall Health Score</span>
        <strong id="avgScore" class="kpi-value">—</strong>
      </div>
      <div class="card kpi">
        <span class="kpi-label">Food Quality Score</span>
        <strong id="weightedScore" class="kpi-value">—</strong>
      </div>
      <div class="card kpi">
        <span class="kpi-label">Tracked Foods</span>
        <strong id="totalItems" class="kpi-value">0</strong>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Top Weekly Drivers</h2>
        <button id="refreshBtn" class="btn btn-ghost">↻ Sync</button>
      </div>
      <div id="topFoodsList" class="list"></div>
    </div>
  </main>

  <!-- Food Catalog View: Options on Left + Separate Food List Table on Right -->
  <main id="tab-catalog" class="tab-content">
    <div class="catalog-split-layout">
      <!-- Left Hand Side: Options Table -->
      <aside class="card options-sidebar">
        <div class="options-header">
          <h2>Options</h2>
          <button type="button" id="resetFiltersBtn" class="btn btn-ghost">Reset</button>
        </div>

        <table class="options-table">
          <tbody>
            <tr>
              <th>Search</th>
              <td>
                <input type="search" id="searchInput" placeholder="Search foods..." />
              </td>
            </tr>
            <tr>
              <th>Sort</th>
              <td>
                <div class="sort-controls">
                  <span id="sortSummaryBadge" class="sort-summary"><strong>Health Score ↓</strong></span>
                  <button type="button" id="sortDirBtn" class="btn btn-ghost" data-dir="desc" title="Toggle sort direction">↓ Desc</button>
                </div>
              </td>
            </tr>
            <tr class="filter-row" data-filter-col="nutri">
              <th>
                <div class="filter-label-row">
                  <span>Nutri</span>
                  <span class="filter-badge hidden" id="badgeNutri">Filtered</span>
                </div>
              </th>
              <td>
                <select id="filterNutri">
                  <option value="ALL" selected>All (A–E)</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="C">C</option>
                  <option value="D">D</option>
                  <option value="E">E</option>
                </select>
              </td>
            </tr>
            <tr class="filter-row" data-filter-col="yuka">
              <th>
                <div class="filter-label-row">
                  <span>Yuka</span>
                  <span class="filter-badge hidden" id="badgeYuka">Filtered</span>
                </div>
              </th>
              <td>
                <div class="op-val-group">
                  <select id="opYuka">
                    <option value="any" selected>Any</option>
                    <option value="gte">&gt;=</option>
                    <option value="lte
